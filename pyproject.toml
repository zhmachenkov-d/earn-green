[project]
name = "earngreen"
version = "0.1.0"
description = "EarnGreen verifies that green tests were earned — Gate A, Hollow Trust Card, Weekly integrity."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "typer>=0.27.0,<0.28",
]

[project.scripts]
earngreen = "earngreen.surfaces.cli:app"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earngreen"]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["earngreen"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
